{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Despesas{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/3.0.2/css/dataTables.dataTables.min.css">
    <style>
        :root {
            --green-50: #effaf4;
            --green-100: #dff4e8;
            --green-200: #c6ead5;
            --green-500: #218c5a;
            --green-600: #197348;
            --green-700: #145c3a;
            --ink: #202a25;
            --text: #46514b;
            --muted: #78837d;
            --line: #e2e9e5;
            --surface: #ffffff;
            --surface-soft: #f7faf8;
            --danger: #b84b4b;
            --danger-bg: #fff6f6;
            --shadow: 0 12px 30px rgba(23, 45, 34, .07);
            --radius: 14px;
        }

        * { box-sizing: border-box; }
        html { min-height: 100%; }
        body {
            margin: 0;
            min-height: 100vh;
            background: #f4f7f5;
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
            line-height: 1.5;
        }

        a { color: var(--green-600); }
        button, input, select, textarea { font: inherit; }

        .app-shell { min-height: 100vh; }
        .app-header {
            position: sticky;
            top: 0;
            z-index: 10;
            background: rgba(255,255,255,.94);
            border-bottom: 1px solid var(--line);
            backdrop-filter: blur(10px);
        }
        .header-inner {
            width: min(1120px, calc(100% - 40px));
            min-height: 72px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 11px;
            color: var(--ink);
            text-decoration: none;
            font-weight: 750;
            letter-spacing: -.02em;
            white-space: nowrap;
        }
        .brand-mark {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: var(--green-500);
            color: white;
            font-weight: 800;
            box-shadow: 0 5px 12px rgba(33,140,90,.2);
        }
        .main-nav { display: flex; align-items: center; gap: 5px; }
        .main-nav a, .nav-button {
            display: inline-flex;
            align-items: center;
            min-height: 38px;
            padding: 7px 11px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: #65716a;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .main-nav a:hover, .nav-button:hover { background: var(--surface-soft); color: var(--green-600); }
        .main-nav a.active { background: var(--green-50); color: var(--green-600); }
        .logout-form { margin: 0; }

        .page-container {
            width: min(1000px, calc(100% - 40px));
            margin: 0 auto;
            padding: 38px 0 64px;
        }
        .page-heading { margin-bottom: 22px; }
        .eyebrow {
            margin: 0 0 5px;
            color: var(--green-600);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .09em;
            text-transform: uppercase;
        }
        .page-title {
            margin: 0;
            color: var(--ink);
            font-size: clamp(23px, 4vw, 30px);
            line-height: 1.15;
            letter-spacing: -.035em;
        }
        .page-subtitle { margin: 7px 0 0; color: var(--muted); }

        .card {
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .card-header {
            padding: 22px 24px;
            border-bottom: 1px solid var(--line);
        }
        .card-body { padding: 24px; }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 8px 15px;
            border: 1px solid transparent;
            border-radius: 9px;
            background: var(--green-500);
            color: white;
            text-decoration: none;
            font-weight: 700;
            cursor: pointer;
            transition: .15s ease;
        }
        .button:hover { background: var(--green-600); color: white; transform: translateY(-1px); }
        .button--secondary { background: white; border-color: #d8e2dc; color: var(--text); }
        .button--secondary:hover { background: var(--surface-soft); color: var(--green-600); }
        .button--danger { background: var(--danger-bg); border-color: #efd3d3; color: var(--danger); }
        .button--danger:hover { background: #fff0f0; color: #a23e3e; }
        .button--icon { width: 40px; padding: 0; font-size: 23px; }

        .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .toolbar-title { margin: 0; color: var(--ink); font-size: 19px; font-weight: 700; letter-spacing: -.015em; }
        .toolbar-subtitle { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

        .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 18px; }
        .field { min-width: 0; }
        .field--full { grid-column: 1 / -1; }
        .field label {
            display: block;
            margin-bottom: 7px;
            color: #37423c;
            font-size: 13px;
            font-weight: 700;
        }
        .field input:not([type="checkbox"]), .field select, .field textarea {
            width: 100%;
            border: 1px solid #d9e2dc;
            border-radius: 9px;
            background: white;
            color: var(--ink);
            padding: 10px 12px;
            outline: none;
            transition: border-color .15s ease, box-shadow .15s ease;
        }
        .field textarea { min-height: 110px; resize: vertical; }
        .field input:not([type="checkbox"]):focus, .field select:focus, .field textarea:focus {
            border-color: var(--green-500);
            box-shadow: 0 0 0 3px rgba(33,140,90,.11);
        }
        .field-check { display: flex; align-items: center; gap: 9px; min-height: 42px; }
        .field-check input { width: 17px; height: 17px; accent-color: var(--green-500); }
        .field-check label { margin: 0; }
        .helptext { display: block; margin-top: 5px; color: var(--muted); font-size: 12px; }
        .errorlist { margin: 6px 0 0; padding: 0; color: var(--danger); list-style: none; font-size: 12px; }
        .non-field-errors { margin-bottom: 18px; padding: 10px 12px; border: 1px solid #efd3d3; border-radius: 9px; background: var(--danger-bg); color: var(--danger); }
        .form-actions { display: flex; justify-content: flex-end; gap: 9px; margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }

        .datatable-toolbar { display: flex; justify-content: flex-end; margin-bottom: 10px; }
        .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
        .data-table-wrap { overflow-x: auto; }
        .data-table { width: 100%; min-width: 700px; border-collapse: collapse; }
        .data-table th {
            padding: 13px 22px;
            background: var(--surface-soft);
            border-bottom: 1px solid var(--line);
            color: #6b766f;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .07em;
            text-align: left;
            text-transform: uppercase;
        }
        .data-table td { padding: 17px 22px; border-bottom: 1px solid #edf1ee; vertical-align: middle; }
        .data-table tbody tr:last-child td { border-bottom: 0; }
        .data-table tbody tr:hover { background: #fbfdfc; }
        .item-title { display: block; color: var(--ink); font-weight: 700; }
        .item-meta { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }
        .badge { display: inline-flex; align-items: center; padding: 5px 9px; border-radius: 999px; background: var(--green-50); color: var(--green-600); font-size: 12px; font-weight: 700; white-space: nowrap; }
        .badge--neutral { background: #f1f4f2; color: #68736d; }
        .table-actions { display: flex; justify-content: flex-end; align-items: center; gap: 7px; white-space: nowrap; }
        .table-actions form { margin: 0; }
        .action-link, .action-button { display: inline-flex; align-items: center; min-height: 34px; padding: 6px 10px; border: 1px solid #dce5df; border-radius: 8px; background: white; color: #3f4b44; text-decoration: none; font-size: 12px; font-weight: 700; cursor: pointer; }
        .action-link:hover, .action-button:hover { background: var(--surface-soft); border-color: #cbd8d0; color: var(--green-600); }
        .action-button--danger:hover { background: var(--danger-bg); border-color: #efd3d3; color: var(--danger); }
        .empty-state { padding: 56px 24px; text-align: center; }
        .empty-icon { width: 44px; height: 44px; display: grid; place-items: center; margin: 0 auto 13px; border-radius: 12px; background: var(--green-50); color: var(--green-600); font-size: 21px; font-weight: 800; }
        .empty-title { margin: 0 0 5px; color: var(--ink); font-weight: 700; }
        .empty-text { margin: 0; color: var(--muted); }

        /* DataTables */
        .datatable-shell { padding: 18px 22px 0; }
        .datatable-filter {
            min-width: 170px;
            border: 1px solid #d9e2dc;
            border-radius: 9px;
            background: white;
            color: var(--text);
            padding: 9px 11px;
            outline: none;
        }
        .datatable-filter:focus {
            border-color: var(--green-500);
            box-shadow: 0 0 0 3px rgba(33,140,90,.11);
        }
        .dt-container { color: var(--text); }
        .dt-container .dt-layout-row { margin: 0; padding: 12px 0; }
        .dt-container .dt-layout-row:first-child { padding-top: 0; }
        .dt-container .dt-search input,
        .dt-container .dt-length select {
            border: 1px solid #d9e2dc;
            border-radius: 9px;
            background: white;
            color: var(--ink);
            padding: 8px 10px;
            outline: none;
        }
        .dt-container .dt-search input:focus,
        .dt-container .dt-length select:focus {
            border-color: var(--green-500);
            box-shadow: 0 0 0 3px rgba(33,140,90,.11);
        }
        .dt-container .dt-info { color: var(--muted); font-size: 12px; }
        .dt-container .dt-paging .dt-paging-button {
            min-width: 34px;
            min-height: 34px;
            margin-left: 4px;
            border: 1px solid transparent !important;
            border-radius: 8px !important;
            color: var(--text) !important;
        }
        .dt-container .dt-paging .dt-paging-button:hover {
            background: var(--surface-soft) !important;
            border-color: var(--line) !important;
            color: var(--green-600) !important;
        }
        .dt-container .dt-paging .dt-paging-button.current {
            background: var(--green-50) !important;
            border-color: var(--green-200) !important;
            color: var(--green-600) !important;
            font-weight: 800;
        }
        .dt-container .dt-paging .dt-paging-button.disabled { opacity: .45; }
        .dt-container .dt-column-order { color: var(--green-600); }
        .data-table thead th { cursor: pointer; }
        .data-table thead th:last-child { cursor: default; }

        .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 11px; overflow: hidden; }
        .detail-item { padding: 17px 18px; background: white; }
        .detail-label { display: block; margin-bottom: 5px; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
        .detail-value { color: var(--ink); font-weight: 650; }
        .detail-description { white-space: pre-wrap; line-height: 1.65; font-weight: 450; }

        .hero-card { padding: 42px; }
        .hero-mark { width: 48px; height: 48px; display: grid; place-items: center; margin-bottom: 18px; border-radius: 13px; background: var(--green-50); color: var(--green-600); font-size: 23px; font-weight: 800; }
        .hero-card h1 { margin: 0; color: var(--ink); font-size: clamp(28px,5vw,38px); letter-spacing: -.045em; line-height: 1.1; }
        .hero-card p { max-width: 650px; margin: 12px 0 0; color: var(--muted); font-size: 15px; }
        .hero-actions { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 24px; }

        .auth-wrap { width: min(440px, 100%); margin: 25px auto 0; }
        .auth-card { padding: 30px; }
        .auth-card .form-grid { grid-template-columns: 1fr; }
        .auth-card .field--full { grid-column: auto; }
        .auth-card .form-actions { justify-content: stretch; }
        .auth-card .form-actions .button { flex: 1; }
        .auth-note { margin: 18px 0 0; color: var(--muted); text-align: center; font-size: 13px; }
        .auth-note a { font-weight: 700; text-decoration: none; }

        .app-footer { width: min(1000px, calc(100% - 40px)); margin: 0 auto; padding: 0 0 30px; color: #98a19c; font-size: 12px; }

        @media (max-width: 760px) {
            .header-inner { width: min(100% - 24px, 1120px); min-height: 64px; flex-wrap: wrap; gap: 4px; padding: 8px 0; }
            .main-nav { width: 100%; overflow-x: auto; padding-bottom: 2px; }
            .page-container { width: min(100% - 24px, 1000px); padding-top: 24px; }
            .form-grid, .detail-grid { grid-template-columns: 1fr; }
            .field--full { grid-column: auto; }
            .hero-card, .card-body, .auth-card { padding: 22px; }
            .toolbar { align-items: flex-start; }
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="app-shell">
    <header class="app-header">
        <div class="header-inner">
            <a class="brand" href="{% url 'inicio' %}">
                <span class="brand-mark">$</span>
                <span>Sistema de Despesas</span>
            </a>
            <nav class="main-nav" aria-label="Navegação principal">
                <a href="{% url 'inicio' %}">Início</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'lista_despesas' %}">Despesas</a>
                    <a href="{% url 'lista_tops' %}">Tops</a>
                    <form class="logout-form" action="{% url 'logout' %}" method="post">
                        {% csrf_token %}
                        <button class="nav-button" type="submit">Sair</button>
                    </form>
                {% else %}
                    <a href="{% url 'sobre' %}">Sobre</a>
                    <a href="{% url 'login' %}">Entrar</a>
                    <a href="{% url 'cadastrar_usuario' %}">Cadastro</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="page-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">Sistema de Despesas</footer>
</div>
    <script src="https://cdn.datatables.net/3.0.2/js/dataTables.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('.js-datatable').forEach(function (table) {
                const config = {
                    language: {
                        search: 'Pesquisar:',
                        lengthMenu: 'Mostrar _MENU_ registros',
                        info: 'Mostrando _START_ a _END_ de _TOTAL_ registros',
                        infoEmpty: 'Nenhum registro encontrado',
                        infoFiltered: '(filtrado de _MAX_ registros)',
                        zeroRecords: 'Nenhum registro encontrado',
                        emptyTable: 'Nenhum registro disponível',
                        paginate: {
                            first: 'Primeiro',
                            last: 'Último',
                            next: 'Próximo',
                            previous: 'Anterior'
                        }
                    },
                    pageLength: 10,
                    lengthMenu: [5, 10, 25, 50],
                    order: [],
                    columnDefs: [
                        { targets: -1, 
                        orderable: false, 
                        searchable: false }
                    ]
                };

                if (table.dataset.dateColumn !== undefined) {
                    const dateColumn = Number(table.dataset.dateColumn);
                    config.columnDefs.push({
                        targets: dateColumn,
                        type: 'date',
                        render: DataTable.render.text()
                    });
                }

                const dataTable = new DataTable(table, config);

                document.querySelectorAll('[data-table-filter]').forEach(function (filter) {
                    if (filter.dataset.tableFilter !== table.id) return;
                    filter.addEventListener('change', function () {
                        const column = Number(filter.dataset.column);
                        dataTable.column(column).search(filter.value).draw();
                    });
                });
            });
        });
    </script>
</body>
</html>
